# Android 发布签名：让每台机器、每次 CI 构建出来的 APK 用同一把钥匙。
#
# 之前 release 沿用 `signingConfigs.getByName("debug")`——本机用的是
# ~/.android/debug.keystore，CI runner 上是另一把自动生成的 debug key，
# 签名不一致，手机上覆盖安装直接 INSTALL_FAILED_UPDATE_INCOMPATIBLE
# （界面提示「应用未安装」）。
#
# 这是一个个人离线笔记工具，签名的用途只是「保证同一个应用身份」，
# 不用于上架分发，所以 keystore 与口令随仓库一起走。要换成自己的：
#   keytool -genkeypair -v -keystore android/app/memonest-release.jks \
#     -alias memonest -keyalg RSA -keysize 2048 -validity 10950 \
#     -storetype PKCS12 -storepass <口令> -dname "CN=..., O=..., C=CN"
# 然后改下面三项。
storeFile=app/memonest-release.jks
storePassword=memonest-release
keyAlias=memonest
keyPassword=memonest-release