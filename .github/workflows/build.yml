name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    name: Windows 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: dart analyze --fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path lib\core\paths.dart -Pattern "appVersion = '([^']+)'").Matches[0].Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 生成安装包
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\MemoNest.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MemoNest-Setup-${{ steps.version.outputs.value }}
          path: dist/installer/MemoNest-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/MemoNest-Setup-${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
          fail_on_unmatched_files: true