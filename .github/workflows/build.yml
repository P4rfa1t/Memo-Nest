name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows 单文件 exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 单元测试
        run: python -m unittest discover -s tests -q

      - name: 打包单文件 exe
        run: pyinstaller MemoNest.spec --noconfirm --clean

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path core/config.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MemoNest-${{ steps.version.outputs.value }}
          path: dist/MemoNest.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MemoNest.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
