name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    name: Windows 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: dart analyze --fatal-infos

      - name: 单元测试
        run: flutter test

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path lib\core\paths.dart -Pattern "appVersion = '([^']+)'").Matches[0].Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 构建 Windows 程序
        run: flutter build windows --release --build-name=${{ steps.version.outputs.value }}

      - name: 生成安装包
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\MemoNest.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MemoNest-Setup-${{ steps.version.outputs.value }}
          path: dist/installer/MemoNest-Setup-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/MemoNest-Setup-${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # minSdk 23（androidx.biometric 的要求）由 android/app/build.gradle.kts 指定，
      # ubuntu-latest 自带 Android SDK，不用另装。
      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoNest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    name: Linux 程序
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 GTK 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux 程序
        run: flutter build linux --release

      - name: 打包
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/MemoNest-linux-x64.tar.gz" bundle

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: MemoNest-linux-x64
          path: MemoNest-linux-x64.tar.gz
          if-no-files-found: error
